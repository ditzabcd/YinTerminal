name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "**.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Custom version (contoh: 1.1.0). Kosongkan untuk auto-increment patch"
        required: false
        type: string
      note:
        description: "Catatan rilis tambahan (opsional)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Resolve version & changelog
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_NOTE: ${{ github.event.inputs.note }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          LAST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | head -n 1)
          TRIMMED_VER=$(echo "${INPUT_VERSION:-}" | xargs)

          if [ -n "$TRIMMED_VER" ]; then
            VERSION_NAME="${TRIMMED_VER#v}"
          elif [ -z "$LAST_TAG" ]; then
            VERSION_NAME="1.0.0"
          else
            CLEAN_TAG="${LAST_TAG#v}"
            MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1 | grep -oE '^[0-9]+' || echo 1)
            MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2 | grep -oE '^[0-9]+' || echo 0)
            PATCH=$(echo "$CLEAN_TAG" | cut -d. -f3 | grep -oE '^[0-9]+' || echo 0)
            PATCH=$((PATCH + 1))
            VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          fi

          TAG_NAME="v${VERSION_NAME}"
          VERSION_CODE="${RUN_NUMBER}"

          sed -E -i "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -E -i "s/versionName[[:space:]]*=[[:space:]]*\"[^\"]*\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts

          {
            echo "## Changes"
            if [ -n "${INPUT_NOTE:-}" ]; then
              printf -- "- %s\n" "$INPUT_NOTE"
            fi

            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log "${LAST_TAG}..HEAD" --no-merges --pretty=format:"- %s" \
                | grep -vE "^- (Merge |Update README|Create README)" || true)
            else
              COMMITS=$(git log -n 10 --no-merges --pretty=format:"- %s" || true)
            fi

            if [ -n "$COMMITS" ]; then
              echo "$COMMITS"
            elif [ -z "${INPUT_NOTE:-}" ]; then
              HEAD_MSG=$(git log -1 --pretty=format:"%s" || true)
              echo "- ${HEAD_MSG:-Bug fixes and improvements}"
            fi
          } > release_notes.md

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Build & sign release APK
        run: |
          set -euo pipefail

          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache --parallel --stacktrace

          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          if [ -z "$RAW_APK" ]; then
            echo "Release APK not found."
            exit 1
          fi

          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK/build-tools/"* | sort -V | tail -n 1)
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          ALIGNED_APK="$RUNNER_TEMP/aligned.apk"
          FINAL_APK="$GITHUB_WORKSPACE/YinTerm-${TAG_NAME}-arm64.apk"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -alias yinterm \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass yinterm123 \
            -keypass yinterm123 \
            -dname "CN=YinTerm, OU=Mobile, O=YinTerm, L=Pekanbaru, S=Riau, C=ID"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$RAW_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass pass:yinterm123 \
            --key-pass pass:yinterm123 \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          SHA256=$(sha256sum "$FINAL_APK" | awk '{print $1}')
          {
            echo ""
            echo "**SHA-256:** \`$SHA256\`"
          } >> release_notes.md

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release delete "$TAG_NAME" --cleanup-tag -y
          fi

          gh release create "$TAG_NAME" "$FINAL_APK" \
            --title "YinTerm $TAG_NAME" \
            --notes-file release_notes.md