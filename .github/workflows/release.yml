name: Build and Release YinTerm

on:
  push:
    branches:
      - main
      - master
    paths:
      - "**.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Extract project archive
        run: |
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in repository root."
            exit 1
          fi
          echo "Extracting $ZIP_FILE..."
          rm -rf extracted_src
          unzip -q "$ZIP_FILE" -d extracted_src

      - name: Build release APK
        run: |
          PROJECT_DIR=$(find extracted_src -maxdepth 3 -name "gradlew" -printf "%h\n" | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "gradlew not found inside archive."
            exit 1
          fi

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "Release APK output not found."
            exit 1
          fi

          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK/build-tools/"* | sort -V | tail -n 1)
          TAG_NAME="v1.0.${{ github.run_number }}"
          FINAL_APK="$GITHUB_WORKSPACE/YinTerm-${TAG_NAME}-arm64.apk"

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias yinterm \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass yinterm123 \
            -keypass yinterm123 \
            -dname "CN=YinTerm, OU=Dev, O=YinTerm, L=ID, S=ID, C=ID"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$RAW_APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-pass pass:yinterm123 \
            --key-pass pass:yinterm123 \
            --out "$FINAL_APK" \
            aligned.apk

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Prepare release notes
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="Manual release build"
          fi

          cat << 'EOF' > release_notes.md
          ### Build Notes
          - ${COMMIT_MSG}
          - Replaced Room & Hilt with local JSON/SharedPreferences storage and manual DI
          - Lazy-loaded Python 3.13 worker process with runtime pip support
          - R8 minification & resource shrinking enabled (`arm64-v8a`)

          ### Install
          Download the `.apk` asset below and install directly on Android 11+ (`arm64-v8a`).
          EOF

          sed -i "s|\${COMMIT_MSG}|${COMMIT_MSG}|g" release_notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" "$FINAL_APK" \
            --title "YinTerm $TAG_NAME" \
            --notes-file release_notes.md
